[project]
name = "control-plane"
version = "0.1.0"
description = "Tenant provisioning control plane with a worker simulator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=9.5,<10",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "tenacity>=9.0,<10",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8,<2",
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6.0,<8",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "SIM", "RUF", "PT", "C4", "RET", "PL",
]
ignore = [
    "PLR0913", # FastAPI endpoints legitimately take many (query) arguments
    "PLR0917", # same, positionally
    "PLR2004", # magic values are fine in tests and HTTP status checks
    "S101",    # assert is fine in tests (bandit is configured separately for app code)
    "B008",    # FastAPI's Depends()/Query() in defaults is the idiomatic pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "ASYNC109"]
"migrations/**" = ["N", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "worker"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:aiormq.*"]

[tool.coverage.run]
source = ["app", "worker"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
